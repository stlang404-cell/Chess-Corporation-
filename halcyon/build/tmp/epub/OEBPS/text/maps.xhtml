<section epub:type="frontmatter"><h2>Maps</h2><figure><img src="../images/map_rim.png" alt="Map of the Rim: an oval salt plain called the Hollow Sea, with the free city of Ambry and the Halcyon on its western shore, Quell on the east, Harl and the Mardens to the south, the Scald desert beyond them, the Varrow Range and Ostmere to the north, and the marsh called the Weeps north-west of Ambry."/><figcaption>The Rim and the Hollow Sea</figcaption></figure><figure><img src="../images/halcyon_section.png" alt="Cross-section of the Halcyon: the Lantern tower on a salt dome; below the surface, five levels called the First to Fifth Fathoms, linked by a spiral Stair and a central light well; below them the sealed Hush; and a dashed Founders' Shaft rising from the Hush to an iron Well-Cap on the plain east of the dome."/><figcaption>The Halcyon</figcaption></figure></section>
