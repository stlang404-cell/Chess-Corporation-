))},children:`Reset career`})})]}),(0,R.jsx)(`p`,{className:`muted small center`,children:`SEVEN v0.2 · rules SEVEN-1.0 · offline · no accounts, ads or real money.`})]})}var Bi=`# The Rules of SEVEN

SEVEN is chess compressed onto a 7×7 board. Every piece moves exactly as in orthodox chess, but there are fewer of them, the armies start closer together, and some familiar habits stop working. This chapter covers the official ruleset, **SEVEN-1.0**, which is the only one used for rated play. Each later chapter builds on it, so read it once even if you already play chess.

## How to use this guide

The guide has three kinds of interactive block. **Diagrams** show a position, sometimes with highlighted squares and arrows. **Exercises** ask you to find a move on the board; the Academy checks your answer and tracks which ones you have solved. **Games** are complete engine games you can step through, with notes at the critical moments.

Every claim in this book is tagged with how sure we are of it. The two tags look like this:

> **Established:** follows from the rules or board geometry, or has been checked by exhaustive analysis or by the SEVEN engine.

> **Hypothesis:** a plausible principle that has not been tested enough to trust blindly. Treat it as advice, not law.

SEVEN is a young game. Most of what top players "know" about it is still hypothesis, and we would rather say so than pass off guesses as theory.

## The board and the armies

The board has seven files, **a** to **g**, and seven ranks, **1** to **7**. White's back rank reads, from a1 to g1:

**R N B Q K B R** — rook, knight, bishop, queen, king, bishop, rook.

White's pawns stand on a2–g2. Black's pieces mirror White's on the same files: rook a7, knight b7, bishop c7, queen d7, king e7, bishop f7, rook g7, with pawns on a6–g6. Note what is missing compared with chess: **one knight per side**. Each army has a rook pair, a bishop pair, a single knight, a queen and seven pawns.

\`\`\`seven
fen: rnbqkbr/ppppppp/7/7/7/PPPPPPP/RNBQKBR w KQkq - 0 1
caption: The starting position. Only three empty ranks separate the armies.
highlight: d1 d7
\`\`\`

Notice three things straight away:

- The queens face each other down the **d-file**, with only two pawns between them.
- Only ranks 3, 4 and 5 are empty. A pawn that double-steps lands on the middle rank and is in contact with the enemy at once.
- The kings start on e1 and e7, next to the f-bishops. The b-knight is the only piece that can move before a pawn does.

## Moves and captures

Kings, queens, rooks, bishops and knights move and capture as in chess. Pawns move one square forward, capture one square diagonally forward, and:

- **Double step.** A pawn on its starting rank (rank 2 for White, rank 6 for Black) may advance two squares if both squares are empty. A White double step goes from rank 2 to rank 4. A Black double step goes from rank 6 to rank 4, so **both sides' double steps land on the same rank**.
- **En passant.** If a pawn double-steps and lands beside an enemy pawn, that enemy pawn may capture it as though it had moved only one square, but only on the very next move.
- **Promotion.** A pawn reaching the last rank (rank 7 for White, rank 1 for Black) must promote to a queen, rook, bishop or knight.

\`\`\`seven
fen: rnbqkbr/pp1pppp/7/2pP3/7/PPP1PPP/RNBQKBR w KQkq c5 0 2
caption: After 1.d4 c4 White may capture en passant with 2.dxc5.
highlight: c5 c4
arrows: d4c5
\`\`\`

> **Established:** a pawn of either colour standing on rank 4 can capture en passant any enemy double step that lands on a neighbouring file. Every double step in SEVEN lands on rank 4, so en passant comes up far more often than in chess.

## Castling

Each side may castle once per game, under the usual conditions. Neither the king nor that rook may have moved. The king may not be in check, and may not pass through or land on an attacked square. The squares between the king and the rook must be empty.

- **Short castling (O-O):** king e1→g1, rook g1→f1. Only f1 needs to be empty.
- **Long castling (O-O-O):** king e1→c1, rook a1→d1. b1, c1 and d1 must be empty.

Black castles in the same way on rank 7 (king to g7 or c7).

\`\`\`seven

caption: Both sides have castled short after 1.e3 e5 2.Be2 Be6 3.O-O O-O.

## How games end

- **Checkmate** wins.
- **Stalemate** is a **draw**.
- **Threefold repetition** of a position is drawn automatically. No claim is needed.
- **80 plies** (40 moves by each side) without a capture or a pawn move is an automatic draw.
- **Dead positions** are drawn: king against king, king and minor piece against king, and similar positions where no mate is possible.

## Notation

SEVEN uses standard algebraic notation on the smaller board. Files run a–g and ranks 1–7, so there is no h-file and no eighth rank. Positions are written in a 7-wide FEN. The start position is:

\`rnbqkbr/ppppppp/7/7/7/PPPPPPP/RNBQKBR w KQkq - 0 1\`

## What the statistics say

The official ruleset was chosen from five candidates by engine self-play (see the project's research notes). Under SEVEN-1.0, White scored **53.7%** (±8.9 at 95% confidence, 120 games at club-level search depth), with **21% draws**, the lowest draw rate of all the candidates.

> **Established:** decisive games are the norm. In the rules study about four games in five had a winner, and most of those ended in checkmate.

> **Hypothesis:** White has a small first-move advantage, comparable to chess. The measured 53.7% fits this, but the confidence interval still includes 50%. Contact comes so quickly in SEVEN that, as Black, your first job is to neutralise White's initiative.

`,Vi=`# The Geometry of the 7×7 Board

A chess player's intuition is tuned to sixty-four squares. SEVEN has forty-nine, and the missing fifteen take away much more than space. This chapter lists the geometric facts that make SEVEN its own game. Nearly everything here is **established**: it can be checked by counting squares.

## One centre square

On an 8×8 board the centre is four squares. On 7×7 it is exactly one: **d4**. Around it is the **inner ring** of eight squares, c3–e3, c4, e4 and c5–e5. Together they form the 3×3 central block. Everything else is the outer zone.

\`\`\`seven
fen: 4k2/7/7/7/7/7/4K2 w - - 0 1
caption: The centre (d4) and the inner ring. Nine squares decide most middlegames.
highlight: d4 c3 d3 e3 c4 e4 c5 d5 e5
\`\`\`

> **Established:** a knight anywhere in the 3×3 central block attacks the full eight squares. One step outside it, a knight attacks six or fewer, and in a corner only two.

> **Established:** d4 is a **dark** square, and so are both long diagonals, a1–g7 and a7–g1. The light-squared bishop can never reach d4 or either long diagonal. Its longest diagonals are six squares long (for example b1–g6).

The second fact matters a great deal. Each side has one dark-squared bishop (White's on c1, Black's on c7) and one light-squared bishop (f1, f7). **The dark-squared bishop is the centre bishop.** It is the only minor piece that can sweep through d4 along a seven-square diagonal.

\`\`\`seven
fen: 4k2/7/7/7/7/7/2B1K2 w - - 0 1
caption: The two long diagonals cross at d4 and are both dark. White's c1-bishop reaches them in one move.
highlight: a1 b2 c3 d4 e5 f6 g7 a7 b6 c5 e3 f2 g1
arrows: c1b2 c1e3
\`\`\`

## Kings live on dark squares

Count the colours of the king squares: e1, g1 and c1 for White, e7, g7 and c7 for Black. With a1 dark, a square is dark when its file number plus its rank number is even, and all six of these squares pass that test.

> **Established:** in SEVEN the king starts on a dark square, and it is still on a dark square after castling either way. All four corners are dark too. The board has 25 dark squares and 24 light ones.

So the enemy's dark-squared bishop is the one that can give check on the king's home squares, and pressure on the dark diagonals is usually pressure on the king. Trading your dark-squared bishop leaves a lasting hole around your own king. We come back to this in the chapters on king safety and positional play.

## How strong the pieces are on an empty board

A useful measure of a piece's power is its average number of moves on an empty board. Here are the numbers for 7×7, next to the familiar 8×8 figures:

- **Knight:** 4.90 (8×8: 5.25), so it keeps 93% of its power.
- **Bishop:** 7.43 (8×8: 8.75), 85%.
- **Rook:** 12.00 (8×8: 14.00), 86%.
- **Queen:** 19.43 (8×8: 22.75), 85%.
- **King:** 6.37 (8×8: 6.56), 97%.

> **Established:** the knight and the king lose almost nothing on the smaller board, while the long-range pieces lose about 15% of their scope. Short distances suit short-range pieces.

> **Established:** a rook on an empty 7×7 board always has exactly twelve moves, wherever it stands. On a board this small, a rook in the corner is just as mobile as a rook in the centre.

## Distances are short

- A king crosses the whole board, e1 to e7, in **six** moves. No two squares are more than six king moves apart.
- A pawn on its starting rank needs **five** steps to promote, or **four** if it uses its double step.
- A pawn that reaches rank 6 (White) or rank 2 (Black) is **one step** from promoting. In chess the same pawn would still have two steps to go.
- The b1-knight reaches the inner ring (c3) in one move and e4 in two, but needs **three** moves to reach d4 (b1–d2–f3–d4 or b1–c3–e2–d4). It starts on a light square and d4 is dark, so it can only arrive after an odd number of moves, and one move is not enough.

> **Established:** the familiar "square of the pawn" rule works unchanged. Draw a square from the pawn to its promotion rank. If the defending king can step into it, it catches the pawn. Because the board is shorter, these squares are small and tempo counts decide endgames quickly.

## The pawn wall and the middle rank

At the start, pawns stand on ranks 2 and 6 with three empty ranks between them. This produces the most important structural fact in SEVEN:

> **Established:** a White pawn that reaches rank 4 attacks two squares on rank 5, and those are exactly the squares Black's rank-6 pawns would advance to. Equally, a Black pawn on rank 4 attacks White's rank-3 squares. *One pawn move by either side creates contact.*

So SEVEN openings are about **pawn contact from move one**. In chess you can spend five or six moves on development before a pawn is attacked. In SEVEN, 1.d4 already stops Black's c- and e-pawns from advancing a single square safely.

## The weak pawns: f2 and f6

Look at which pieces defend each White pawn in the start position:

- a2: rook. b2: c1-bishop. c2: queen. d2: knight, bishop, queen and king.
- e2: queen, king and f1-bishop. g2: rook and f1-bishop.
- **f2: only the king.**

> **Established:** f2 (and f6 for Black) is the only starting pawn defended by the king alone. It is the SEVEN counterpart of chess's f2/f7. It is also a dark square, so the enemy dark-squared bishop can hit it (for Black, along c5–d4–e3–f2).

There is a second point about the f-file. The f-bishop stands directly behind the f-pawn, so the f-file is plugged until the bishop leaves. Moving the f-pawn does not develop that bishop either: it needs the e- or g-pawn to move first.

> **Established:** in the engine's ranking of White's first moves (300k nodes, depth 10), 1.f3 and 1.f4 came out among the weakest pawn moves, about 50 centipawns worse than 1.d4.

> **Hypothesis:** the f-file is a *rook's* file, not a pawn's. It opens with the most effect after short castling has put a rook on f1.

## The edge is close

With only seven files, the a- and g-files are one step from the edge of a board that is itself only three steps from the centre. A piece on the b- or f-file is already near the rim. Two consequences:

- **Rook pawns.** The a- and g-pawns are rook pawns. As in chess, a rook pawn is the hardest pawn to promote with a minor piece's help. The board's edge is never far away.
- **Kings run out of room fast.** A king driven to the edge has at most four flight squares, and often fewer. Many SEVEN mating nets need only two pieces.

\`\`\`seven

caption: A knight on d4 attacks eight squares, about one sixth of the board. No other minor piece is this efficient.
highlight: c6 e6 b5 f5 b3 f3 c2 e2
\`\`\`

## Summary

- The centre is **one square, d4**, plus an eight-square ring.
- Both long diagonals and every king square are **dark**. The dark-squared bishop is the key minor piece.
- Knights and kings keep their strength on the small board. Long-range pieces lose about 15%.
- **Rank 4 is the contact rank.** A single pawn move creates tension.
- **f2/f6** is the weak pawn, guarded only by the king.

`,Hi=`# Material: What the Pieces Are Worth

Every chess player carries a price list in their head: pawn 1, knight 3, bishop 3, rook 5, queen 9. Does it survive the move to 7×7? Mostly, yes, with a few corrections that matter in practice. This chapter separates what we have measured from what we still believe.

## The engine's working values

The SEVEN engine scores material in centipawns (hundredths of a pawn). It uses separate values for the middlegame and the endgame and blends them as pieces come off:

- **Pawn:** 88 in the middlegame, 115 in the endgame.
- **Knight:** 315 middlegame, 290 endgame.
- **Bishop:** 320 middlegame, 320 endgame.
- **Rook:** 470 middlegame, 520 endgame.
- **Queen:** 900 middlegame, 940 endgame.

> **Hypothesis:** these values were set by hand and tuned for playing strength, not derived from SEVEN games. They are a sensible starting point, but they were not measured on this board.

To see how the engine's *search* weighs material in a real position, we set up a quiet, symmetrical position (1.e3 e5 2.Be2 Be6 3.O-O O-O, base evaluation +0.30 for White) and removed one Black unit at a time. The engine then searched each position to depth 10 (300,000 nodes):

- Without Black's **knight**: White +3.21, so the knight is worth about 2.9 pawns.
- Without Black's **dark-squared bishop**: +3.51, about 3.2 pawns.
- Without Black's **a-rook**: +5.25, about 4.95 pawns.
- Without Black's **queen**: +9.17, about 8.9 pawns.
- Without Black's **d-pawn**: +0.97. Without the **a-pawn**: +0.99. Without the **g-pawn** next to the castled king: **+1.53**.
- Without **knight and bishop**: +6.36, compared with +5.25 for the rook.

> **Established:** in the engine's judgment the bishop is worth a little more than the knight, two minor pieces are worth clearly more than a rook (about one pawn more), and a pawn of the castled king's shelter is worth nearly twice an ordinary pawn (+1.23 against +0.67).

> **Hypothesis:** the engine's figures inherit its hand-set values, so they are partly circular. A proper measurement needs many games from material-odds starting positions. Until that has been done, treat the classical 1–3–3–5–9 scale as accurate to within half a pawn for the minor pieces and rooks.

## Knight against bishop

The geometry chapter showed that the knight keeps 93% of its 8×8 mobility on the smaller board, while the bishop keeps only 85%. That argues for the knight. The bishop's other weakness is that the light-squared bishop can never touch the centre square d4. On the other hand, the board is so short that a bishop on a long diagonal covers both wings at once.

> **Established:** in the middlegame the knight is relatively stronger in SEVEN than in chess, because its range is barely reduced while the bishop's is.

> **Hypothesis:** in open positions the **dark-squared bishop** is worth more than the knight, which in turn is worth about as much as the **light-squared bishop**. When you must give up a bishop for the knight, give up the light one.

There is also a practical point. The knight is the only minor piece that can jump over the pawn wall. In the opening, before any pawn has moved, it is the *only* piece besides the pawns with a legal move. That makes it the first piece to develop and often the first to be exchanged.

## The bishop pair is the default

Because each side starts with two bishops and one knight, **the bishop pair is the normal state of affairs**. In chess you "win" the bishop pair. In SEVEN you *lose* it, usually by trading a bishop for the enemy knight.

> **Established:** a side that trades a bishop for the opposing knight is left with bishop and knight against two bishops. The opponent then holds the bishop pair, and with it control of both square colours.

> **Hypothesis:** the bishop pair is worth roughly half a pawn in open middlegames and more in endgames, as in chess. The effect may be smaller in SEVEN because the board is short enough for a knight to cover both wings quickly.

\`\`\`seven
fen: 6k/p1pnbpp/3p3/3P3/3BP2/PB3PP/6K w - - 0 1
caption: Material is level, but White has the bishop pair. The engine rates White clearly better (+2.8 at depth 11). Black's light-squared bishop is also hemmed in by its own pawns on c6 and d5.
highlight: b2 d3 c6 d5
\`\`\`

## Mating material

With so little room, which material can still force mate? We checked every position of the basic endings with an exhaustive retrograde solver written independently of the engine.

> **Established:** king and queen against king, and king and rook against king, are wins from every legal position with the stronger side to move. The longest forced mate takes **8 moves** with the queen (10 on 8×8) and **14 moves** with the rook (16 on 8×8).

> **Established:** king and two bishops (on opposite colours) against king is a forced win. The longest forced mate takes **16 moves** (19 on 8×8).

> **Established:** king, bishop and knight against king is a forced win only with the **dark-squared** bishop (99.3% of positions; longest mate 21 moves, against 33 on 8×8). With the light-squared bishop it is a draw except in a handful of positions where the king is already trapped. All four corners of the 7×7 board are dark, and a lone king can only be mated by B+N in a corner of the bishop's colour.

> **Established:** king and knight against king, and king and bishop against king, are dead draws. King and two knights cannot force mate either, except in rare positions where the defending king is already trapped.

So the small board makes bishop and knight against king *much* easier than in chess, at most 21 moves against 33, but only if you kept the right bishop. See the Endgames chapter.

## The exchange and other trades

Rook for minor piece ("the exchange") is worth about a pawn and a half in the engine's view. As in chess, the exchange counts for more as the board empties: with only seven files, an open file is reached in two or three moves and a rook dominates the endgame.

> **Hypothesis:** queen against two rooks favours the rooks slightly in SEVEN, because the queen has lost 15% of its mobility, and the rooks find open files quickly on a seven-file board.

> **Hypothesis:** a rook and two connected passed pawns are usually stronger than two minor pieces in the endgame, because the pawns need only four or five moves to promote.

## Pawns: fewer, closer, faster

Each side has seven pawns, and every one is close to promotion. A pawn on its fifth rank (rank 5 for White) is two steps from queening. A passed pawn in SEVEN is therefore worth more than its nominal 1.0, and the engine raises its pawn value from 88 to 115 as pieces come off.

## Summary

- Use **1–3–3–5–9**, but expect the dark-squared bishop to beat a knight in open positions and the knight to hold its own in closed ones.
- The **bishop pair is the default**. Avoid giving it away for nothing.
- **King-shelter pawns** count for more than ordinary pawns.
- All the standard mates are forced, and **shorter** than on 8×8.

`,Ui=`# Opening Principles

The chess opening rules "develop knights before bishops, control the centre, castle early" were worked out over centuries on a board with four central squares and two knights a side. Some of them carry over to SEVEN unchanged. Others have to be rewritten. This chapter sets out the principles. The next one turns them into concrete opening systems.

## Principle 1: every pawn move is a commitment

Only three ranks separate the armies, so the first pawn move nearly always produces contact or the threat of it.

- A pawn on **rank 3** (White) controls rank 4, the square where Black's pawns would land after a double step.
- A pawn on **rank 4** controls rank 5, the squares Black's pawns need for a single step.
- A pawn on **rank 5** is already attacking Black's pawns on rank 6.

> **Established:** after 1.d4, Black's c- and e-pawns cannot step to c5 or e5 without being captured. Black's natural freeing moves are a single step *onto contact*, ...c5 or ...e5, offering an exchange, or a double step on a different file.

> **Hypothesis:** SEVEN openings are about **choosing which pawn tension to create**, not about avoiding it. A move that keeps the tension, such as 1.d4 c5 2.e3, is usually better than resolving it early with 2.dxc5.

## Principle 2: develop the knight with purpose, not by reflex

In the start position White's only piece moves are 1.Na3 and 1.Nc3. "Knights first" is therefore automatic, but it is not necessarily good. In the engine's ranking of first moves (300,000 nodes), **1.Nc3 and 1.Na3 came out below every central pawn move**, about half a pawn worse than 1.d4.

> **Established:** the knight is the only minor piece that can develop before a pawn moves, but an early knight move gives the opponent a target. After 1.Nc3 d4, the knight must move again (2.Ne4) and the engine already prefers Black slightly.

> **Hypothesis:** the knight is best developed *after* the central pawn structure is decided. That usually means d2 (supporting e4 or c4) or c3 behind a d4 pawn. Treat the knight as a flexible reserve, not as an opening move.

The knight's long-term job is to reach a strong post in the inner ring, ideally a square the enemy pawns can no longer attack. Since there is only one knight, never exchange it lightly. Your opponent's bishop pair grows stronger the moment it disappears.

## Principle 3: the bishops come out through the pawns

Both bishops are locked in at the start. The c1-bishop needs the b- or d-pawn to move. The f1-bishop needs the e- or g-pawn to move, never the f-pawn, which stands directly in front of it.

> **Established:** the f1-bishop can reach e2 (after an e-pawn move) or g2 (after a g-pawn move). Either square prepares short castling, which needs only f1 to be empty.

> **Established:** the c1-bishop is the **dark-squared** bishop, the one that can use the long diagonals and the centre square d4. Opening the b-pawn (b3, Bb2) or the d-pawn (Bd2, Be3, Bf4) frees it.

> **Hypothesis:** the dark-squared bishop belongs on a long diagonal (b2 or the d4 square itself) or on e3, where it protects f2 and d4. Avoid trading it early, since it is also the bishop that guards the king's colour complex.

## Principle 4: the d-file is a fuse

The two queens face each other down the d-file at the start. The only things between them are the d-pawns. If both d-pawns disappear, the queens can be exchanged with check, and in the starting setup **only the king defends the queen**.

> **Established:** after 1.d4 c5 2.dxc5 dxc5? White plays 3.Qxd7+ Kxd7. Black's king must recapture, gives up castling and stands in the open. The engine rates this +0.47 for White. The correct recapture 2...bxc5 keeps the d-file closed, and the engine then rates the position only +0.18.

\`\`\`seven

Remember this pattern from both sides: **do not be the one who opens the d-file while your king still guards your queen.** It applies equally after an early ...d5/exd5 exchange or any central liquidation.

## Principle 5: castle short, castle soon, but not automatically

Short castling needs only the f-bishop out of the way, and it tucks the king into the g1 corner behind f2 and g2. Long castling takes at least three preparatory piece moves and puts the king on c1 behind a2, b2 and c2, with the rook landing on the d-file facing the enemy queen.

> **Established:** short castling is available from move 3 (1.e3, 2.Be2, 3.O-O), long castling from move 4 at the earliest. In the ten engine games generated for this guide, short castling was played eleven times and long castling never.

> **Hypothesis:** castle short when the f-file and g-file are still closed, and castle long only when the d-file is already open and you want your rook on it at once. Even then, check that the enemy dark-squared bishop cannot reach your king's diagonals.

Castling is not a ritual. In the Quiet Lane (1.e3 e5 2.Be2 Be6) the engine prefers 3.d4 (+0.33) to 3.O-O. The fight for the centre is more urgent than king safety while Black's pieces are still at home.

## Principle 6: count tempi on the double step

The double step gains a tempo, but it lands on rank 4, the rank where the opponent's own double steps land, and where en passant applies.

> **Established:** a double step next to an enemy pawn on rank 4 can be captured en passant. Before you play ...c4 against a pawn on d4, or b4 against a pawn on c4, check whether the en passant capture helps your opponent.

> **Hypothesis:** in practice the en passant capture is often *not* the best reply. After 1.d4 c4 the engine prefers 2.b3 (+0.32) to 2.dxc5 e.p. (+0.18). Undermining the advanced pawn is worth more than taking it.

## Principle 7: watch rank 5 and the pawn fork

Pieces developed to rank 5 (for Black, rank 3) stand exactly where an enemy pawn arriving on rank 4 will hit them. Two pieces on the same rank with one square between them are a pawn fork waiting to happen.

## A checklist for the first five moves

1. Which pawn tension am I creating, and do I want it resolved or maintained?
2. Is the d-file about to open? If so, can my queen be exchanged with check?
3. Is my f-bishop free to move, so that I can castle short?
4. Is any of my pieces on the contact rank (rank 5 for Black, rank 3 for White) where a pawn can fork it?
5. Does my opponent have an en passant capture or a pawn lever (a pawn push that attacks an enemy pawn, offering a capture) against f2/f6?

`,Wi=`# Opening Systems

This chapter names and describes the main opening systems of SEVEN. The names are this guide's own; SEVEN is too young for traditional ones. Every evaluation quoted comes from the SEVEN engine searching 300,000 nodes (roughly depth 9–11), always from **White's point of view**, in pawns.

> **Established:** in our tests, repeated searches of the same positions at slightly different depths moved by up to 0.2 pawns. Treat differences under about 0.3 as noise. Read every figure below as "roughly equal", "pleasant edge" or "clearly better", not as an exact verdict.

## How White's first moves rank

Searching the start position, the engine prefers **1.d4 (+0.20)**. Next come 1.a4 (+0.04) and 1.a3 (−0.12). The knight moves 1.Na3 (−0.25) and 1.Nc3 (−0.27) are near the bottom, and the f-pawn moves 1.f3 and 1.f4 are worse still. Quiet moves such as 1.e3 and 1.d3 are playable and lead to slower games.

> **Hypothesis:** the d-pawn is White's best first move because it is the only pawn that is defended four times at the start (knight, bishop, queen, king), and on d4 it controls both c5 and e5 at once.

## The Meridian: 1.d4

\`\`\`seven

highlight: d4 c5 e5
\`\`\`

The pawn on d4 takes away Black's two central single steps and stakes a claim to the only centre square. Black has four serious replies.

### The Cross: 1...c5

Black challenges the pawn at once. The c6-pawn steps onto c5, attacking d4 and itself attacked by it.

- **2.e3!** (+0.18) is the main line. White supports d4 with a pawn, opens the f1-bishop and prepares short castling. After 2...cxd4 3.exd4 d5 (+0.20) the position is open and balanced. The e-file is half open for White and the c-file for Black.
- **2.dxc5** releases the tension. Black must answer **2...bxc5!** (+0.18), recapturing towards the centre with the d-file still closed. 2...dxc5? opens the d-file and runs into 3.Qxd7+ Kxd7 (+0.47). See Principle 4 in the previous chapter.

\`\`\`seven

caption: The Cross after 1.d4 c5 2.e3. White holds d4 with a pawn and frees the f1-bishop.

title: The Cross, main line
moves: 1. d4 c5 2. e3 cxd4 3. exd4 d5 4. Be2 Nd6 5. O-O
notes: 2:2.e3 keeps the tension and prepares Be2 and O-O. | 3b:Black blockades the d4-pawn and opens the diagonal of the c7-bishop. | 5:White castles on move five with a comfortable, slightly freer game.
\`\`\`

### The Hook: 1...g4

`,Gi=`# King Safety

On a board where the enemy pawns start three ranks away and a queen crosses the board in one move, king safety is never a later problem. This chapter describes where the king is safe in SEVEN, what attacks it, and which mating patterns follow from the board's shape.

## The king in the centre

At e1 the king has three problems:

1. **It is the only defender of f2.** Any attack on f2 is an attack on a pawn defended once.
2. **It is the only defender of the queen.** If the d-file opens, Qxd1+ (or Qxd7+) forces the king to recapture and give up castling.
3. **It stands on the e-file**, which opens as soon as the e-pawns are exchanged. With so few pieces between the rooks and the king, an open e-file means an immediate check.

> **Hypothesis:** leaving the king in the centre past move 8 or so in an open position is usually a serious mistake in SEVEN, more so than in chess, because every line to it is short.

## The short-castled king

After O-O the king sits on g1 behind two pawns, f2 and g2, with the rook on f1. There is no h-pawn. The shelter is half the size of chess's three-pawn shelter.

\`\`\`seven
fen: rnbq1rk/ppppbpp/4p2/7/4P2/PPPPBPP/RNBQ1RK w - - 4 4
caption: Both kings castled short. Each sits at the end of a long dark diagonal: g1 on a7–g1, g7 on a1–g7.
highlight: a7 b6 c5 d4 e3 f2 g1 a1 b2 c3 e5 f6 g7
\`\`\`

> **Established:** g1 is the end square of the long diagonal a7–g1, and g7 the end square of a1–g7. A short-castled king always sits on a seven-square dark diagonal. The enemy's dark-squared bishop or queen on that diagonal is aimed straight at it, with only the f2 (or f6) pawn in the way.

> **Established:** the long-castled king on c1 (or c7) is *not* on a long diagonal. Its diagonals run only to a3 and to g5.

> **Hypothesis:** the defender's dark-squared bishop is therefore the most important defensive minor piece after short castling. Keep it, and keep the f-pawn on f2 (f6 for Black) as long as possible, since that pawn blocks the long diagonal.

The engine agrees that shelter pawns count for more. In a castled position, removing Black's g6-pawn lifted White's evaluation from +0.30 to +1.53, while removing the d-pawn lifted it only to +0.97 (see the Material chapter).

## Luft and the back rank

With only two pawns in front of the king, the classic back-rank mate is everywhere. A rook or queen reaching the first rank (or the seventh, against Black) mates if the king has no flight square.

\`\`\`exercise
id: king-back-rank
level: 1
fen: 6k/5pp/p6/7/1n5/Pb3PP/3R2K w - - 0 1
prompt: White to move and mate in one.
solution: Rd7#
explanation: Black's king on g7 is boxed in by its own pawns on f6 and g6. Rank 7 is Black's back rank, and nothing can block the check or capture the rook.
\`\`\`

The cure is the same as in chess: a pawn move that gives the king a flight square ("luft"). In SEVEN there are only two candidates, and both have costs:

- **g3 (or ...g5)** gives the king g2 but loosens the long diagonal, since the f2-pawn then stands alone in front of the king.
- **f3 (or ...f5)** gives the king f2 but opens the a7–g1 diagonal straight to the king.

> **Hypothesis:** the better luft is usually **g3**. It keeps f2 in place as a blocker on the long diagonal, and it can be supported by the f1-rook from behind. Play f3 only when the enemy's dark-squared bishop has gone.

## The pawn storm arrives fast

The enemy g-pawn reaches g3 in two moves: ...g4 (a double step) and ...g3. At that point it attacks f2 (and h2, which does not exist). This is the idea of the Hook opening.

> **Established:** a double step and a single step bring a pawn from its home square to the third rank of the enemy's side. In SEVEN a pawn storm can strike the castled king's shelter by move 2.

The general defensive rule: **do not open the file the storming pawn wants opened.** Meeting ...g3 with f3, keeping the pawn locked on g3, is better than fxg3, which opens the f-file in front of your own king (see the Hook in the Opening Systems chapter).

## Mating patterns of the small board

### The smothered corner

After short castling the black king on g7 has the rook on f7 beside it and pawns on f6 and g6 in front. If those squares stay occupied, a knight check on e6 can be mate, because the king's own pieces fill every flight square.

solution: Ne6#
explanation: The knight checks from e6. The king's three neighbouring squares, f7, f6 and g6, are filled by its own rook and pawns, so it cannot move, and nothing can capture the knight.
\`\`\`

### The Arabian corner

A rook on the g-file next to the king, protected by a knight, mates when the knight also covers the last flight square.

\`\`\`

### The long-diagonal fork

Because the castled king sits on a long diagonal, a queen arriving on d4 (or d5 against a king on g1) often gives check *and* attacks something on the other wing. The same line runs from the king through the centre to the far corner.

explanation: From d4 the queen checks the king on g7 along the a1–g7 diagonal and attacks the rook on a7 along the a7–g1 diagonal. Both long diagonals cross at d4.
\`\`\`

## Mating attacks in practice

The patterns combine. Here a queen, rook and bishop finish off a king that has lost its shelter.

solution: Qxf5+ Ke7
explanation: The queen takes the f5-bishop with check. After 1...Ke7, one clean finish is 2.Qxe5+ Kf7 3.Rf1#: the queen covers e7, f6 and g7, the bishop on e4 covers g6, and nothing can block the f-file. (2.Rf1 also mates quickly. The key was the first capture, which strips the king's cover.)
\`\`\`

## Summary

- The **f-pawn** blocks the long diagonal in front of the short-castled king. Keep it there.
- The defender's **dark-squared bishop** guards the king's colour complex.
- **Back-rank mates** are very common, because only two pawns shelter the king.
- Meet a pawn storm by keeping files closed, not by capturing.
- Learn the small-board patterns: smothered corner, Arabian corner, long-diagonal fork.
`,Ki=`# Pawn Structures

Seven pawns a side, three empty ranks, and promotion five steps away. SEVEN's pawn structures are simpler than chess's, because there are fewer pawns. They are also more brittle, because every pawn is close to contact. This chapter covers the structures you will meet most often and how to handle them.

## Contact, tension and levers

A **lever** is a pawn move that attacks an enemy pawn and offers an exchange. In SEVEN almost every pawn move to rank 4 (or ...rank 4 for Black) is a lever or prepares one.

> **Established:** two pawns on adjacent files, one on rank 4 and one on rank 5, attack each other. Whoever captures first changes the structure. The other side chooses the recapture.

Rules of thumb for tension:

- **Keep tension** when your opponent's capture would improve your structure, for example by opening a file for your rook or bringing a pawn to the centre.
- **Release tension** when your opponent threatens to capture in a way that gives them the better recapture, or when the capture gains a tempo.
- **Recapture towards the centre.** After 1.d4 c5 2.dxc5, the engine rates 2...bxc5 (bringing a pawn towards the centre) as clearly better than 2...dxc5, which also opens the dangerous d-file.

## The Cross structure

After 1.d4 c5 2.e3 cxd4 3.exd4 d5 the pawns stand:

- **White:** a2, b2, c2, d4, f2, g2. The e-file is half open.
- **Black:** a6, b6, d5, e6, f6, g6. The c-file is half open.

\`\`\`seven
fen: rnbqkbr/pp2ppp/3p3/3P3/7/PPP2PP/RNBQKBR w KQkq - 0 4
caption: The Cross structure after 1.d4 c5 2.e3 cxd4 3.exd4 d5. Each side has a half-open file pointing at the other's king side or queen side.
highlight: d4 d5 e2 c6
\`\`\`

> **Hypothesis:** in the Cross structure White's plans are Re1 or Qe2 on the half-open e-file and a knight on e5 via d2–f3 or c3–e2–f4. Black's are ...Rc7 on the half-open c-file and pressure on c2. The blocked d-pawns mean the queens are *not* in danger of an early exchange.

## The isolated pawn

When a pawn has no friendly pawn on either neighbouring file it is **isolated**. In SEVEN an isolated pawn on d4 controls the key squares c5 and e5, and it cannot be supported by another pawn.

> **Hypothesis:** an isolated d-pawn is a middlegame strength (space, outposts on c5 and e5) and an endgame weakness (a fixed target only a few files from both enemy rooks). The short board makes the endgame weakness bite sooner: the enemy king reaches d5 quickly.

## Pawn chains are short

A diagonal chain such as c3–d4 or b2–c3–d4 has at most three links before it hits the enemy's pawns. Its base, the rearmost pawn, is the target.

> **Established:** a chain whose front pawn stands on rank 4 is in contact with the enemy pawns on rank 5 or 6 at once. There is no room for a "long" chain in SEVEN.

> **Hypothesis:** attack the base of the chain, as in chess, but expect the fight to be settled within a few moves. The time between creating a chain and seeing it broken is very short.

## The g3 bone

When Black's Hook pawn reaches g3 and White answers f3 (keeping the f-file closed), a black pawn sits in White's camp, two steps from promotion.

\`\`\`seven

caption: The g3 bone after 1.d4 g4 2.a4 g3 3.f3. Black's pawn cramps White's kingside but can also become a target.
highlight: g3 f2 f3
\`\`\`

> **Hypothesis:** if White can attack the g3-pawn with pieces (Bf4, Qe1, Rg1) it becomes a weakness. If Black can support it with ...Bf4 or ...Rg-file pressure, it becomes a permanent wedge against White's short castling. White often castles long, or leaves the king in the centre, in these lines.

## Passed pawns

A passed pawn is far stronger in SEVEN than in chess:

- From rank 4 it needs three steps to promote (rank 5, 6, 7).
- From rank 5 it needs only two steps.
- From rank 6 it needs one, and the defender often has to give up a piece for it.

> **Established:** a passed pawn that reaches the sixth rank (the third for Black) is one move from promotion. A rook behind it, or a king beside it, usually decides the game.

### The outside passed pawn

On a seven-file board the a- and g-files are the "outside" files. A passed pawn there drags the enemy king to the edge while your king goes the other way.

### Breakthrough

Three pawns against three on adjacent files, with an empty rank between them, can be broken open by a sacrifice. The same geometry works in chess, but in SEVEN the pawns start closer to their goal.

Pawns are the cheapest attackers. A pinned piece attacked by a pawn is usually lost.

## Summary

- Every pawn move creates contact. Decide whether to keep or release the tension.
- **Recapture towards the centre**, and keep the d-file closed while the queens are protected only by the kings.
- Chains are short. Strike their base early.
- Passed pawns are worth more than in chess. **Outside passers** and **breakthroughs** win endgames.
`,qi=`# Tactical Patterns

Tactics are the same in every chess variant: forks, pins, skewers, discovered attacks, overloaded defenders. What changes is *where* they appear and *how often*. On a 7×7 board lines are short, pieces are always close together, and most tactics are just one or two moves deep. This chapter goes through the patterns and shows how SEVEN's geometry shapes each one.

> **Established:** with 49 squares and up to 28 pieces, the starting board is 57% occupied (chess: 50%). Pieces stand closer together, and a single move attacks more targets.

## Forks

### The knight fork

The lone knight is SEVEN's most dangerous forking piece. It barely loses mobility on the small board, and every enemy piece is within a few knight moves. The classic target is king and queen.

highlight: d5 e7 b6
arrows: c3d5
\`\`\`

solution: Nd5+ Kf7 Nxb6
explanation: Nd5+ forks the king on e7 and the queen on b6. The king must move, and the knight takes the queen.
\`\`\`

> **Hypothesis:** the square in front of the enemy king's starting square (d5/d3 when the king is on e7/e1) is the critical fork square in SEVEN. A knight landing there attacks four of the king's neighbouring squares at once.

### The pawn fork

On the contact rank, a pawn advancing one square attacks two squares on the next rank. Pieces placed with one empty square between them on that rank are a standing invitation (see the Mirror Fork exercise in the Opening Principles chapter).

### The queen fork

The queen covers so much of a 49-square board that almost any check also attacks something else. Before every queen check, ask what *else* the queen hits from its new square.

## Pins

### Pins on the dark diagonals

Both kings start on e-file dark squares, and the most natural square for a dark-squared bishop is **b4**:

- White's bishop on b4 looks along c5–d6–e7, at Black's king.
- Black's bishop on b4 looks along c3–d2–e1, at White's king.

> **Established:** a dark-squared bishop on b4 pins any piece standing on d6 (for Black) or on d2 or c3 (for White) against the uncastled king. Black's knight often goes to d6 (via b7–d6) and White's to d2 or c3, so these pins come up constantly. Bb4+ (or ...Bb4+) is a common check in the opening.

### Pins on the files

When the d-file or e-file opens with a king still on e1 or e7, a rook or queen can pin a piece to the king. Then a *pawn* attacking the pinned piece usually wins it (see the Pin and Push exercise in the Pawn Structures chapter).

## Skewers

A skewer is a pin the other way round: the more valuable piece is in front. On a seven-file board kings and rooks often share a rank or file, and the long diagonals line up the king with the far corner, so skewers are frequent. You met the long-diagonal skewer in the Geometry chapter.

> **Hypothesis:** in rook endgames, a skewer along the third or fifth rank (king and rook on the same rank) is the most common tactical blunder. The board is too narrow for the king to hide from a rook that changes ranks.

## Discovered attacks

A piece moving off a line can reveal an attack by the piece behind it. On a small board the revealing piece often captures something too.

\`\`\`

## Captures with check, and in-between moves

Because everything is close together, many exchanges can be **interrupted** by a capture with check. Before automatically recapturing, look for an in-between move (*zwischenzug*).

## Removing the guard

Sometimes the fork square or the check square is covered by an enemy piece, or an enemy piece could block the check. Take that piece first, even at the cost of material.

When the enemy king is in the open, a sequence of checks often builds a net.

On a seven-rank board a pawn on the sixth rank is one step from promotion. The defender often has to stop it with a check first.

Most points in SEVEN are lost, as in chess, by simply leaving pieces unprotected. On this board every piece is inside an enemy piece's range much sooner than you expect.

## Summary

- **Knight forks** on the square in front of the enemy king are the signature SEVEN tactic.
- **b4** is the dark bishop's pinning square for both sides.
- Look for **in-between checks** before every recapture.
- A pawn on the sixth rank (third for Black) forces the defender to act **now**, often with a check.
`,Ji=`# Combinations, Sacrifices and Defence

A combination is a forcing sequence, usually beginning with a sacrifice, that changes the position by force. The previous chapter catalogued the building blocks. This chapter is about putting them together, and about the other side of the coin: how to defend when your opponent is the one combining.

## Why combinations are short in SEVEN

> **Established:** in the positions mined from engine self-play for this guide, most decisive tactics were one to three moves deep. The longest forced mates we found were four moves.

There are two reasons. Pieces are close together, so a sacrifice quickly reaches its target. And with fewer pieces, there are fewer defenders to bring over. In practice this means you can and should calculate combinations **to the end**. They rarely run deeper than you can see.

## Calculating a forcing line

Use the classical order: **checks, captures, threats**. On a 7×7 board checks are especially powerful, because a checked king has at most a handful of squares to go to, and often only one.

\`\`\`exercise
id: combo-promotion-mate
level: 4
fen: 5k1/1P3p1/6p/7/r4n1/1K5/3R3 w - - 2 40
prompt: White to move and mate in four.
solution: b7=Q+ Kg6 Qe4+ f5
explanation: The pawn queens with check, and every following move is a check. Qe4+ forces ...f5, and then Rd6+ drives the king to g7, and a queen mates on the seventh rank (for example Qb7#), with the rook on d6 covering g6 and f6.
\`\`\`

## The decoy and the deflection

A **decoy** lures a piece onto a bad square. A **deflection** lures a defender away from its duty. The Remove-the-Blocker exercise in the Tactics chapter was a deflection: the rook took the knight that would have blocked the queen's check.

> **Hypothesis:** the most common defender to deflect in SEVEN is the **king itself**, which at the start defends both the queen and the f-pawn. A check that drags the king to one of those squares often wins the other.

## Bringing in the last piece

The best combinations use every piece. A move that does not capture or check but brings one more attacker into play can be the strongest. On a small board one extra attacker usually decides. In Game 1 of the Annotated Games chapter, 16.Bg4 (bringing the last minor piece into the attack) took the engine's evaluation to about +1.9.


## Sacrifices on f2 and f6

f2 is defended only by the king at the start, and after short castling it is the pawn that blocks the long diagonal to g1. A sacrifice there, by a bishop or knight, aims to drag the king out or open the a7–g1 diagonal.

> **Hypothesis:** an early piece sacrifice on f2 (or f6) is sound only when the queen can follow up with check on the long diagonal or on the e-file. Without that follow-up, the king is safe enough on f2 and the sacrifice fails. The board is small, but not *that* small.

## Defensive technique

Defending in SEVEN is about four things: **counting**, **simplifying**, **using the draw rules** and **counter-attack**.

### Count the attackers

Before reacting to a threat, count attackers and defenders on the key square. The short board means a piece can usually be brought over to defend in a single move.

### When two pieces are attacked, capture first

If two of your pieces are hanging at once, often the best defence is to take something yourself.

level: 3

prompt: Black's queen attacks the bishop on f5. Black's knight on b2 is attacked by the bishop on c1, and Black's bishop on a3 defends it. White to move and limit the damage.
solution: Bxb2 Qxf5 Bxa3
explanation: White gives up the f5-bishop but takes both of Black's minor pieces in return. Retreating the f5-bishop leaves White a piece down. The engine scores the alternatives about 3.3 pawns worse.
\`\`\`

### Trade into endgames you can hold

The queen is the attacking piece. Trading queens kills most attacks, and in SEVEN it is often easy to force: the queens start on the same file, and there are few pieces to get in the way. The d-file exchange that hurts the side whose king must recapture (see Opening Principles) can be a *defensive* resource later, once your king is safe.

### Use the draw rules

SEVEN has three rules a defender should know by heart:

- **Stalemate is a draw.** On a small board the defending king runs out of squares quickly, and so it is easy to *be* stalemated. Look for a sacrifice that leaves you with no legal move.
- **Threefold repetition is automatic.** A perpetual check needs only three repetitions, and nobody has to claim it.
- **80 plies without a capture or pawn move** is a draw. If your opponent cannot make progress, they will run out of time on this count.

A rook or queen giving checks from long range is the defender's best friend on an open board. Watch for checks that also *skewer*.

> **Established:** engine self-play under the official rules produced draws in about one game in five. Most of them were threefold repetitions. The rest were dead positions, the 80-ply rule and the occasional stalemate.

> **Hypothesis:** in human play the small board's stalemate tricks, perpetual checks and skewers save more bad positions than in chess. Before resigning, look for all three.

`,Yi=`# Endgames

The endgame is where SEVEN differs most from chess, and where exact knowledge is easiest to come by. With few pieces on 49 squares, positions can be solved completely. For this guide we wrote a retrograde solver, independent of the playing engine, and solved the basic mates outright. Everything marked *Established* in the first half of this chapter comes from that solver or from engine verification.

## King and queen against king

> **Established:** king and queen against king is a win from every legal position with the queen's side to move. The longest forced mate is **8 moves** (10 on 8×8).

\`\`\`seven
fen: K4Q1/7/7/7/4k2/7/7 w - - 0 1

highlight: a7 e3

The technique is the same as in chess. Restrict the king with the queen, a knight's move away, until it is on the edge, then bring your own king in. Two dangers are greater on the small board:

- **Stalemate.** A king in the corner has only three neighbouring squares. A careless queen move takes all three.
- **Short distances.** Your king is never more than six moves from anywhere, so be patient. The mate is rarely more than a few moves away.

## Bishops and knights

> **Established:** king and two bishops against king, with the bishops on opposite colours, is a forced win from 99.9% of legal positions with White to move. The exceptions are immediate captures and stalemates. The longest forced mate takes **16 moves** (19 on 8×8). Two bishops of the same colour can never mate.

> **Established:** king, **dark-squared** bishop and knight against king is a forced win from 99.3% of legal positions with White to move. The exceptions are immediate captures and stalemates. The longest forced mate takes **21 moves** (33 on 8×8). With the **light-squared** bishop, only 0.1% of positions are wins, all of them mates in one or two where the king is already trapped. As in chess, mate is forced in a corner of the bishop's colour, and **every corner on the 7×7 board is dark**.

> **Established:** king and two knights against king cannot force mate. Our solver found forced wins only in positions that are already mate in one.

The bishop-and-knight result is the most surprising fact in this chapter. In chess, B+N always has a pair of corners to mate in, whatever the bishop's colour. In SEVEN, the same ending is a win with the dark-squared bishop and a draw with the light-squared one.

> **Hypothesis:** this is one more reason to keep the dark-squared bishop. Trading it can turn a won minor-piece ending into a draw.

### The wrong bishop

> **Established:** a rook pawn promotes on a7 or g7 (for Black, a1 or g1), and all four of those squares are dark. The light-squared bishop can never control the queening square of a rook pawn.

> **Hypothesis:** as in chess, king + light-squared bishop + rook pawn against a king that reaches the corner is a draw: the defending king sits on the corner square and can only be stalemated, never driven out. The SEVEN engine does not recognise this fortress and still scores such positions as clearly winning, so do not trust its evaluation here.

Pawn endings on 7×7 follow the chess rules of **opposition** and **key squares**, shifted down one rank because the board is one rank shorter.

> **Hypothesis:** a pawn on rank 2 or 3 (White) has its key squares two ranks ahead. For a pawn on d2 they are c4, d4 and e4; for a pawn on d3, c5, d5 and e5. If White's king reaches a key square, the pawn promotes whatever Black does. These are the chess rules applied to the shorter board. They agreed with the engine in every position we tested, but we have not checked them exhaustively.

- **The double step is a tempo weapon.** A pawn still on its starting rank can choose between one step and two. That flexibility often decides who gets the opposition. Before pushing, count which version leaves the *opponent* to move in the critical position.

With bishops of the **same colour**, the defender's bishop fights for the queening path. The attacker's technique is to **interfere**, putting their own bishop on the line the defending bishop uses.

> **Hypothesis:** with **opposite-coloured** bishops, the drawing tendency is even stronger than in chess. The defending bishop can usually blockade on a square two steps ahead of the pawn, and on a seven-file board there is little room to create a second passed pawn far enough away.

## Rook endings

Rook endings are the most common endings in engine self-play, as in chess. The ideas carry over, adapted to the short board:

> **Hypothesis:** the **Philidor defence** works in SEVEN. With the defending king on the queening square, the defending rook holds the attacker's fifth rank (the sixth rank on 8×8) until the pawn advances, then checks from behind. The board's shortness leaves the attacker even less room to hide from the checks.

> **Hypothesis:** the **Lucena** winning method (building a bridge with the rook to shelter the king from checks) also works, but the bridge must be built on the fourth rank rather than the fourth from the top. Test this in your own analysis before relying on it.

> **Hypothesis:** an extra pawn in a rook ending is a stronger advantage than in chess. With only seven files, the defending rook has fewer squares from which to check the king from a safe distance.

## Summary

- **KQ vs K** (8 moves at most) and **KR vs K** (14 moves at most) are forced wins. Avoid stalemate in the corners.
- **B+N vs K** wins only with the **dark-squared bishop**. **Two knights** cannot force mate.
- The **light-squared bishop** can never help a rook pawn queen.
- **Opposition and key squares** work as in chess, shifted one rank down.
- **Double steps** and **stalemate** are the two tactical surprises of SEVEN pawn endings.
`,Xi=`# Positional Play and Practical Decision-Making

Tactics decide most SEVEN games, but positional understanding decides which side gets the tactics. This chapter covers the long-term factors that matter on the 7×7 board. It then turns to two practical skills: managing the clock and calculating under pressure.

## Long-term factors

### The dark squares

Everything important in SEVEN is dark: the centre square d4, both long diagonals, every king square (e1, g1, c1 and their Black counterparts), and every promotion corner.

> **Established:** a side that has lost its dark-squared bishop cannot contest d4 with a bishop, cannot use the long diagonals, cannot cover its own castled king's diagonal, and (in the endgame) cannot force mate with bishop and knight.

> **Hypothesis:** the dark-squared bishop is worth about a quarter of a pawn more than the light-squared bishop in most middlegames, and much more in endings with a knight or rook pawns. Treat a trade of dark bishops as a major positional decision, and a trade of your dark bishop for the enemy knight as a real concession.

### Outposts

An **outpost** is a square that no enemy pawn can attack. In SEVEN the best outposts are in the inner ring, on the enemy's half of the board: c5, d5 and e5 for White, and c3, d3 and e3 for Black.

> **Hypothesis:** the knight, the only piece that can sit comfortably on an outpost surrounded by pawns, is SEVEN's natural outpost piece. A knight on d5 or e5 supported by a pawn, with no enemy c- or e-pawn able to challenge it, is usually worth more than either enemy bishop.

### Open files

There are only seven files, so every open file is a large fraction of the board. The rooks start in the corners and need just one move (Rd1, Re1, Rc1, after castling) to reach a central file.

> **Hypothesis:** the first rook to an open central file in SEVEN often decides the middlegame. After short castling, the f1-rook is already on the f-file. If that file opens, the rook is immediately active.

### Space

With three empty ranks at the start, a pawn on rank 4 already takes away squares in the opponent's half. "Space" in SEVEN is measured in single squares. Taking one more rank-5 square from your opponent can leave their pieces with nowhere to go.

### Exchanges

Which pieces to trade?

- **Trade the knight** only with care. You have only one, and the opponent keeps the bishop pair.
- **Keep the dark-squared bishop** unless trading it wins something concrete.
- **Trade queens when you are ahead in material or king safety.** The queen is the attacking piece, and a queen trade turns the game into an endgame where the stronger structure wins.
- **Keep rooks when you have a passed pawn.** A rook behind a passed pawn on this short board is decisive.

## Time management at 5+3

The default clock in SEVEN is **5 minutes plus 3 seconds per move**.

> **Established:** in engine self-play under the official rules, games averaged about 102 plies (51 moves per side). Over 51 moves a player has 300 seconds of base time plus 51 × 3 = 153 seconds of increment, about **9 seconds per move** on average.

Practical guidelines:

1. **Spend on the first contact.** The first pawn tension (usually by move 1–3) shapes the whole game, and the board is so small that a bad structure is hard to repair. Taking 20–30 seconds over your first contact decision is good value.
2. **Spend on transitions.** Trading into an endgame, especially a pawn ending, is irreversible, and pawn endings in SEVEN are calculable to the end. Spend the time to calculate them exactly.
3. **Play quickly in technical positions.** Known mates (KQ vs K, KR vs K) should take no thinking time. The 3-second increment is enough if you know the technique. KR vs K takes at most 14 moves.
4. **Never let your clock drop below 20 seconds in a complex middlegame.** With 3 seconds a move you can survive indefinitely only if each move is simple.
5. **Watch the 80-ply rule in won endings.** A position you cannot convert in 40 moves without a capture or pawn move is a draw. KBN vs K needs up to 21 moves, so you have time, but not time to waste.

> **Hypothesis:** in 5+3 play, most losses in balanced positions come from flagging or blundering in the last minute, not from opening errors. Bank time early by knowing the opening systems in this guide.

## A method for calculation

Calculation on a small board is easier in one way (fewer pieces, shorter lines) and harder in another (every move matters). Use this four-step routine.

### Step 1: scan for checks, captures and threats, for both sides

Start with **your opponent's** checks and captures. That is the blunder check. On 7×7 nearly every piece is within two moves of every other, so look at the whole board, not only "where the action is".

### Step 2: count the king's squares

When a king is involved, count its flight squares. On this board a king rarely has more than four, and on the edge or in a corner it has two or three. If you can take them all away with tempo, look for mate. If your own king has only one or two, look for your opponent's mate first.

### Step 3: list candidates and calculate forcing lines to the end

Write down (mentally) two or three candidate moves. Calculate forcing lines **to the end**. Tactical sequences in SEVEN rarely go beyond three or four moves, so you can usually reach a quiet position and evaluate it.

### Step 4: evaluate with the SEVEN factors

When a line ends in a quiet position, evaluate it with the factors of this book, in this order:

1. **Material**, using 1–3–3–5–9 (and the pawn values of the endgame).
2. **King safety**: shelter pawns, the long diagonal, the back rank.
3. **Passed pawns.** In SEVEN they are worth more than in chess.
4. **The dark squares and the dark-squared bishops.**
5. **Activity**: open files, outposts, the inner ring.

## Concepts special to SEVEN

To finish, here are the ideas that have no direct counterpart in chess, collected in one place:

- **The contact rank.** Rank 4 is where both sides' double steps land, and any pawn there is in contact. Pieces on rank 5 (rank 3 for Black) are exposed to pawn forks.
- **The Meridian fuse.** The queens face each other on the d-file, each defended only by its king. Opening the d-file can cost the other side the right to castle.
- **The dark complex.** Centre, long diagonals, kings and promotion corners are all dark.
- **The lone knight.** It is the only jumper, the only piece that develops before the pawns, and the main forking piece. Only one is available, so trading it gives away the bishop pair.
- **The f-pawn shield.** f2/f6 is defended only by the king at the start, blocks the f-bishop's file and, after short castling, shields the long diagonal to the king.
- **Frequent en passant.** Because all double steps end on rank 4, en passant is a regular part of opening play.
- **Short endgames.** Basic mates take at most 8 (queen), 14 (rook), 16 (two bishops) or 21 (bishop and knight) moves.

`,Zi=`# Annotated Games

The four games in this chapter were played by the SEVEN engine against itself under the official rules. Each side searched about 100,000 nodes per move, which is strong club level for this variant. The first few moves were fixed to reach the opening system under study. After that the engine was on its own.

The notes were written afterwards with the help of a deeper search (300,000 nodes) of the critical positions. Evaluations are in pawns from White's point of view. Where the deeper search disagreed with the moves played, we say so. These are engine games, with engine mistakes, and the point is to show SEVEN's themes at work, not to present flawless play.

## Game 1: The Cross with a Hook

White plays the main line of the Cross. Black combines it with a Hook-style g-pawn advance, and White answers by giving up the exchange for the dark squares.

- After short castling, **opening the f-file is good for the side that owns it**. Here that was White, with a rook on f1 and a queen behind it.
- The **exchange sacrifice for the dark squares** is a typical SEVEN idea: a bishop on the long diagonal plus a queen on the light squares can be worth more than a rook.

## Game 2: The Duel

The most balanced opening in our tests, in its natural course. Both sides push Hook-style g-pawns. Everything is traded, and the game ends in a dead draw.

**Lessons.**

- In the Duel, **both sides can launch the Hook**. The ...g4–g3 lever is a weapon for either colour.
- **En passant comes up naturally**: 13...e4 14.dxe5 e.p.
- With **symmetrical, simplified pawn structures**, even a king walk to d5 is not enough to win. The board is too small for a single extra pawn to make a passed pawn safely.

SEVEN is chess on a 7×7 board. If you know chess you already know 95% of SEVEN; this document states every rule exactly, including the places where the smaller board required a decision.

## 1. Board and notation

- 7 files **a–g** (left to right from White's side) and 7 ranks **1–7**. 49 squares.
- **a1 is a dark square.** Squares alternate as usual.
- The single centre square is **d4**. The "inner ring" is c3–e3–e5–c5.
- Moves are written in standard algebraic notation (SAN): \`Nc3\`, \`exd4\`, \`O-O\`, \`a7=Q+\`. Positions use FEN with 7-character ranks.

## 2. Starting position

\`\`\`
 7  r n b q k b r      Black
 6  p p p p p p p
 5  . . . . . . .
 4  . . . . . . .
 3  . . . . . . .
 2  P P P P P P P
 1  R N B Q K B R      White
    a b c d e f g
\`\`\`

FEN: \`rnbqkbr/ppppppp/7/7/7/PPPPPPP/RNBQKBR w KQkq - 0 1\`

\`\`\`seven
fen: rnbqkbr/ppppppp/7/7/7/PPPPPPP/RNBQKBR w KQkq - 0 1
caption: The SEVEN starting position. Only three empty ranks separate the armies.
highlight: d4
\`\`\`

Each side has **one king, one queen, two rooks, two bishops, one knight and seven pawns** (14 pieces). Black's pieces stand on the same files as White's (the queens face each other on the d-file, the kings on the e-file). The two bishops start on opposite colours (c1 and c7 dark, f1 and f7 light), so every army begins with the bishop pair. White moves first.

## 3. How the pieces move

Exactly as in chess:

| Piece | Movement |
|---|---|
| King | one square in any direction |
| Queen | any distance along ranks, files and diagonals |
| Rook | any distance along ranks and files |
| Bishop | any distance diagonally |
| Knight | an "L": two squares in one direction and one at right angles; jumps over pieces |
| Pawn | one square forward; captures one square diagonally forward |

Pieces may not move through other pieces (except the knight) and capture by moving onto an enemy piece.

### 3.1 Pawns

- **Double step:** a pawn on its starting rank (White rank 2, Black rank 6) may advance two squares if both squares are empty.
- **En passant:** if a pawn double-steps past a square attacked by an enemy pawn, that enemy pawn may capture it, on the very next move only, as if it had moved one square.
- **Promotion:** a pawn reaching the last rank (White rank 7, Black rank 1) is immediately replaced by a queen, rook, bishop or knight of the same colour, chosen by the player.

Because only three ranks separate the armies, a double step from rank 2 lands a White pawn on rank 4 — already touching the enemy's half of the board.

## 4. Castling

Each side may castle once per game, toward either rook:

| | King | Rook |
|---|---|---|
| **Short (O-O)** | e1 → g1 | g1 → f1 |
| **Long (O-O-O)** | e1 → c1 | a1 → d1 |

(Black identically on rank 7.) Castling is legal only if:

1. neither the king nor that rook has moved;
2. every square between the king and the rook, and every destination square, is empty (apart from the king and rook themselves) — for short castling f1 must be empty, for long castling b1, c1 and d1;
3. the king is not in check, does not pass through an attacked square, and does not land in check.

In the user interface, castle by moving the king to its destination square (g1 or c1).

## 5. Check, checkmate and stalemate

- A king that is attacked is **in check**; a player may never make a move that leaves their own king in check.
- **Checkmate:** the side to move is in check and has no legal move — that side **loses**.
- **Stalemate:** the side to move is not in check and has no legal move — the game is a **draw**.

## 6. Draws

A game is drawn automatically when:

1. **Stalemate** occurs (§5).
2. **Threefold repetition:** the same position (same pieces on the same squares, same side to move, same castling and en-passant rights) occurs for the third time.
3. **The 40-move rule:** 80 consecutive plies (40 moves by each side) are played with no capture and no pawn move.
4. **Dead position:** neither side can possibly checkmate — king vs king; king and one minor piece vs king; or kings and bishops only, all bishops on one square colour.
5. **Agreement:** a draw offer is accepted. In rated games, draw offers are available from move 20 onwards (anti-collusion), at most three per game.

## 7. Time

- **Untimed is the standard for every match type** — rated, promotion series, Arena Cup, casual and training. There is no clock, no countdown and no loss on time: a player may think as long as they like, leave, close the app and resume later.
- The engine's own thinking is bounded separately (by its strength tier's search budget and a per-move time cap), so an opponent never stalls a game.
- *Optional timed play* (advanced setting): 5+3, 3+2 or 10+5 (minutes + seconds increment). In timed games only, a player whose clock reaches zero loses, unless the opponent has no way to checkmate (only a king, or a king and a single minor piece), in which case the game is drawn. A timed game in progress from v0.1 keeps its clocks.

## 8. Resignation and abandonment

A player may resign at any time (with confirmation); the game is lost. A game in progress is saved after every move and resumes when the app is reopened.

## 9. Fair-play rules for rated games

- No take-backs (undo exists only in casual and training games).
- No engine hints or analysis during a rated game (engine review is available afterwards).
- Rated results are committed atomically and exactly once.

## 10. Illustrated examples

**Short castling.** From \`r3k1r/ppppppp/7/7/7/PPPPPPP/R3K1R w KQkq - 0 1\`, \`O-O\` leaves White's back rank as \`R4RK\` (rook a1, rook f1, king g1).

\`\`\`seven
fen: r3k1r/ppppppp/7/7/7/PPPPPPP/R3K1R w KQkq - 0 1
caption: Both castling moves are available: O-O (king to g1) and O-O-O (king to c1).
arrows: e1g1 e1c1
\`\`\`

**Castling through check is illegal.** In \`r3k1r/ppppp1p/7/7/2b4/PPP1PPP/R3K1R w KQkq - 0 1\` the bishop on c3 attacks e1 (c3–d2–e1), so White is in check and may not castle either way.

**Back-rank mate.** \`6k/5pp/7/7/7/7/R3K2 w - - 0 1\`: \`Ra7#\` — the king on g7 is boxed in by its own f6 and g6 pawns.

\`\`\`seven
fen: 6k/5pp/7/7/7/7/R3K2 w - - 0 1
caption: Ra7 is checkmate.
arrows: a1a7
\`\`\`

**Stalemate.** \`6k/7/5QK/7/7/7/7 b - - 0 1\`: Black to move has no legal move and is not in check — draw.

**Promotion.** \`3k3/P6/7/7/7/7/3K3 w - - 0 1\`: \`a7=Q+\` (or \`=R+\`, \`=B\`, \`=N\`).

These examples are executed by the engine test-suite (\`tests/engine.test.ts\`), so the rulebook and the engine cannot drift apart.

## 11. Move-generation reference counts (perft)

From the starting position: 16, 249, 4,506, 79,417, 1,606,599, 31,757,845 positions at depths 1–6. Depths 1–4 are cross-checked against an independent reference move generator in the test-suite.

## 12. Why these rules

The setup was chosen by automated self-play among five candidate rulesets; see \`docs/RESEARCH.md\`. In short: dropping one knight (rather than the queen or a bishop) kept the game decisive and the first-move advantage close to orthodox chess, the double step keeps openings fast on a board with only three empty ranks, and castling materially reduced draws compared with the same setup without castling.

## 13. Game records (SEVEN-PGN)

Games export as standard PGN with three variant tags so any reader knows the board is 7×7:

\`\`\`
[Variant "SEVEN-1.0"]
[SetUp "1"]
[FEN "rnbqkbr/ppppppp/7/7/7/PPPPPPP/RNBQKBR w KQkq - 0 1"]
\`\`\`

Moves are standard SAN on files a–g and ranks 1–7 (\`O-O\` = king to g1, \`O-O-O\` = king to c1). The FEN uses 7-character ranks. Implementation: \`src/game/pgn.ts\`.
